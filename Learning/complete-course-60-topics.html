<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Stack JavaScript Course - Topics 1-60</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0e27;
      --bg-card: #151932;
      --bg-hover: #1e2440;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #3b82f6;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 320px;
      background: var(--bg-card);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem;
      overflow-y: auto;
      position: fixed;
      height: 100vh;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      background: var(--bg-hover);
      height: 8px;
      border-radius: 4px;
      margin: 1rem 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.3s;
    }

    .section-group {
      margin-top: 1.5rem;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .main-content {
      margin-left: 320px;
      flex: 1;
      padding: 3rem;
      max-width: 1200px;
    }

    .topic-header {
      margin-bottom: 3rem;
    }

    .topic-title {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .topic-subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
    }

    .content-section {
      margin: 2rem 0;
    }

    .explanation {
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--text-primary);
      margin: 1.5rem 0;
    }

    .info-box {
      background: rgba(59, 130, 246, 0.1);
      border-left: 4px solid var(--info);
      padding: 1.5rem;
      margin: 1.5rem 0;
      border-radius: 8px;
    }

    .info-box h4 {
      color: var(--info);
      margin-bottom: 0.5rem;
    }

    .warning-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--warning);
      padding: 1.5rem;
      margin: 1.5rem 0;
      border-radius: 8px;
    }

    .warning-box h4 {
      color: var(--warning);
      margin-bottom: 0.5rem;
    }

    .code-block {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      border-left: 4px solid var(--accent-cyan);
      position: relative;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .code-title {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .code-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .code-button {
      padding: 0.5rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .code-button:hover {
      background: var(--accent-cyan);
      color: white;
    }

    pre {
      overflow-x: auto;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .output-container {
      background: #000;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
      font-family: 'Courier New', monospace;
    }

    .output-header {
      color: var(--accent-cyan);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .output-content {
      color: #0f0;
      white-space: pre-wrap;
    }

    .quiz-container {
      margin-top: 3rem;
      padding: 2rem;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .quiz-header {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: var(--accent-purple);
    }

    .quiz-question {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .quiz-option {
      padding: 1rem;
      margin: 0.5rem 0;
      background: var(--bg-hover);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .quiz-option:hover {
      transform: translateX(4px);
      border-color: var(--accent-cyan);
    }

    .quiz-option.selected {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.2);
    }

    .quiz-option.correct {
      background: var(--success);
      border-color: var(--success);
    }

    .quiz-option.incorrect {
      background: var(--error);
      border-color: var(--error);
    }

    .quiz-feedback {
      margin-top: 1.5rem;
      padding: 1.5rem;
      border-radius: 8px;
    }

    .quiz-feedback.correct {
      background: rgba(16, 185, 129, 0.2);
      border-left: 4px solid var(--success);
    }

    .quiz-feedback.incorrect {
      background: rgba(239, 68, 68, 0.2);
      border-left: 4px solid var(--error);
    }

    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      font-size: 1rem;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .nav-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 3rem;
    }

    .topic-list {
      margin-top: 1rem;
    }

    .topic-item {
      padding: 0.75rem;
      margin: 0.5rem 0;
      background: var(--bg-hover);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topic-item:hover {
      transform: translateX(4px);
      background: rgba(6, 182, 212, 0.2);
    }

    .topic-item.active {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    }

    .topic-item.completed {
      border-left: 3px solid var(--success);
    }

    .checkmark {
      color: var(--success);
      font-weight: bold;
    }
  </style>
</head>

    function App() {
      const [currentTopicIndex, setCurrentTopicIndex] = useState(0);
      const [completedTopics, setCompletedTopics] = useState({});
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showFeedback, setShowFeedback] = useState(false);
      const [codeOutputs, setCodeOutputs] = useState({});

      const currentTopic = courseData[currentTopicIndex];
      const progress = (Object.keys(completedTopics).length / courseData.length) * 100;

      const sections = {};
      courseData.forEach((topic, index) => {
        if (!sections[topic.section]) {
          sections[topic.section] = [];
        }
        sections[topic.section].push({ ...topic, index });
      });

      const runCode = (code, index) => {
        try {
          const logs = [];
          const originalLog = console.log;
          console.log = (...args) => {
            logs.push(args.map(arg => 
              typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' '));
          };
          eval(code);
          console.log = originalLog;
          setCodeOutputs(prev => ({ ...prev, [index]: logs.join('\n') }));
        } catch (error) {
          setCodeOutputs(prev => ({ ...prev, [index]: 'Error: ' + error.message }));
        }
      };

      const checkAnswer = () => {
        if (selectedAnswer === currentTopic.quiz.correct) {
          setCompletedTopics(prev => ({ ...prev, [currentTopic.id]: true }));
        }
        setShowFeedback(true);
      };

      const nextTopic = () => {
        if (currentTopicIndex < courseData.length - 1) {
          setCurrentTopicIndex(currentTopicIndex + 1);
          setSelectedAnswer(null);
          setShowFeedback(false);
          setCodeOutputs({});
          window.scrollTo(0, 0);
        }
      };

      const prevTopic = () => {
        if (currentTopicIndex > 0) {
          setCurrentTopicIndex(currentTopicIndex - 1);
          setSelectedAnswer(null);
          setShowFeedback(false);
          setCodeOutputs({});
          window.scrollTo(0, 0);
        }
      };

      return (
        <div className="container">
          <div className="sidebar">
            <div className="logo">Full Stack Mastery</div>
            <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
              Complete Course: JavaScript to Production
            </p>
            
            <div className="progress-bar">
              <div className="progress-fill" style={{ width: `${progress}%` }}></div>
            </div>
            <p style={{ textAlign: 'center', fontSize: '0.9rem', marginTop: '0.5rem' }}>
              {Math.round(progress)}% Complete
            </p>

            {Object.entries(sections).map(([sectionName, topics]) => (
              <div key={sectionName} className="section-group">
                <div className="section-title">
                  {sectionName} ({topics.length})
                </div>
                <div className="topic-list">
                  {topics.map((topic) => (
                    <div
                      key={topic.id}
                      className={`topic-item ${
                        topic.index === currentTopicIndex ? 'active' : ''
                      } ${completedTopics[topic.id] ? 'completed' : ''}`}
                      onClick={() => {
                        setCurrentTopicIndex(topic.index);
                        setSelectedAnswer(null);
                        setShowFeedback(false);
                        setCodeOutputs({});
                      }}
                    >
                      <span>
                        {topic.icon} {topic.title}
                      </span>
                      {completedTopics[topic.id] && (
                        <span className="checkmark">✓</span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div className="main-content">
            <div className="topic-header">
              <h1 className="topic-title">
                {currentTopic.icon} {currentTopic.title}
              </h1>
              <p className="topic-subtitle">{currentTopic.subtitle}</p>
            </div>

            {currentTopic.content.map((section, index) => (
              <div key={index} className="content-section">
                {section.type === 'explanation' && (
                  <div className="explanation">{section.text}</div>
                )}
                
                {section.type === 'info' && (
                  <div className="info-box">
                    <h4>{section.title}</h4>
                    <pre style={{ whiteSpace: 'pre-wrap', lineHeight: '1.6' }}>
                      {section.text}
                    </pre>
                  </div>
                )}
                
                {section.type === 'warning' && (
                  <div className="warning-box">
                    <h4>{section.title}</h4>
                    <pre style={{ whiteSpace: 'pre-wrap', lineHeight: '1.6' }}>
                      {section.text}
                    </pre>
                  </div>
                )}
                
                {section.type === 'code' && (
                  <div className="code-block">
                    {section.title && (
                      <div className="code-header">
                        <span className="code-title">{section.title}</span>
                        <div className="code-buttons">
                          {section.runnable && (
                            <button
                              className="code-button"
                              onClick={() => runCode(section.code, index)}
                            >
                              ▶ Run
                            </button>
                          )}
                          <button
                            className="code-button"
                            onClick={() => navigator.clipboard.writeText(section.code)}
                          >
                            📋 Copy
                          </button>
                        </div>
                      </div>
                    )}
                    <pre>{section.code}</pre>
                    {codeOutputs[index] && (
                      <div className="output-container">
                        <div className="output-header">Output:</div>
                        <div className="output-content">{codeOutputs[index]}</div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            ))}

            {currentTopic.quiz && (
              <div className="quiz-container">
                <h3 className="quiz-header">Test Your Knowledge</h3>
                <p className="quiz-question">{currentTopic.quiz.question}</p>
                <div>
                  {currentTopic.quiz.options.map((option, index) => (
                    <div
                      key={index}
                      className={`quiz-option ${
                        selectedAnswer === index && !showFeedback ? 'selected' : ''
                      } ${
                        showFeedback && index === currentTopic.quiz.correct ? 'correct' : ''
                      } ${
                        showFeedback && selectedAnswer === index && index !== currentTopic.quiz.correct ? 'incorrect' : ''
                      }`}
                      onClick={() => !showFeedback && setSelectedAnswer(index)}
                    >
                      {option}
                    </div>
                  ))}
                </div>
                {!showFeedback && (
                  <button
                    onClick={checkAnswer}
                    disabled={selectedAnswer === null}
                    style={{ marginTop: '1.5rem' }}
                  >
                    Check Answer
                  </button>
                )}
                {showFeedback && (
                  <div
                    className={`quiz-feedback ${
                      selectedAnswer === currentTopic.quiz.correct ? 'correct' : 'incorrect'
                    }`}
                  >
                    <strong>
                      {selectedAnswer === currentTopic.quiz.correct ? '✓ Correct!' : '✗ Incorrect'}
                    </strong>
                    <p style={{ marginTop: '0.5rem' }}>{currentTopic.quiz.explanation}</p>
                  </div>
                )}
              </div>
            )}

            <div className="nav-buttons">
              <button onClick={prevTopic} disabled={currentTopicIndex === 0}>
                ← Previous
              </button>
              <button onClick={nextTopic} disabled={currentTopicIndex === courseData.length - 1}>
                Next →
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    setTimeout(() => lucide.createIcons(), 100);
  </script>
</body>
</html>
