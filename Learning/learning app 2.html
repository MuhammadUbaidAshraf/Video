<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Full Stack JavaScript & Node.js Mastery</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide-static@0.263.1/font/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #131729;
      --bg-tertiary: #1a1f3a;
      --accent-cyan: #00d9ff;
      --accent-pink: #ff0080;
      --accent-yellow: #ffeb3b;
      --accent-green: #00ff88;
      --accent-purple: #9d4edd;
      --accent-orange: #ff6b35;
      --text-primary: #e8eaf6;
      --text-secondary: #9fa8da;
      --text-muted: #5c6bc0;
      --border: #283593;
      --code-bg: #0d1117;
      --success: #00ff88;
      --warning: #ffeb3b;
      --error: #ff1744;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .app-container {
      display: flex;
      height: 100vh;
      position: relative;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }

    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .bg-gradient {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      animation: float 15s ease-in-out infinite;
    }

    .bg-gradient-1 {
      background: var(--accent-cyan);
      top: 10%;
      left: 20%;
    }

    .bg-gradient-2 {
      background: var(--accent-pink);
      bottom: 20%;
      right: 10%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 30px) scale(0.9); }
    }

    /* Sidebar */
    .sidebar {
      width: 360px;
      background: var(--bg-secondary);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
    }

    .sidebar-header {
      padding: 30px 20px;
      border-bottom: 2px solid var(--border);
      background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .progress-container {
      margin-top: 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg-tertiary);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      transition: width 0.5s ease;
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    /* Topic List */
    .topics-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .section-header {
      padding: 16px 12px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-count {
      background: var(--bg-tertiary);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 9px;
      color: var(--text-muted);
    }

    .topic-item {
      padding: 10px 14px;
      margin: 4px 0;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      position: relative;
      overflow: hidden;
    }

    .topic-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: var(--accent-cyan);
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .topic-item:hover {
      background: var(--bg-primary);
      border-color: var(--accent-cyan);
      transform: translateX(4px);
    }

    .topic-item:hover::before {
      transform: scaleY(1);
    }

    .topic-item.active {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(255, 0, 128, 0.1));
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
    }

    .topic-item.active::before {
      transform: scaleY(1);
    }

    .topic-item.completed {
      border-color: var(--success);
    }

    .topic-icon {
      font-size: 15px;
      min-width: 18px;
      text-align: center;
    }

    .topic-item.completed .topic-icon {
      color: var(--success);
    }

    .topic-name {
      flex: 1;
      font-weight: 500;
      line-height: 1.3;
    }

    .check-icon {
      color: var(--success);
      font-size: 14px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      overflow-y: auto;
      position: relative;
      z-index: 1;
    }

    .content-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px;
    }

    .topic-header {
      margin-bottom: 40px;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topic-title {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      line-height: 1.2;
    }

    .topic-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* Content Sections */
    .section {
      margin-bottom: 50px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title i {
      font-size: 22px;
    }

    .section-content {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .section-content ul {
      margin-left: 24px;
      margin-top: 12px;
    }

    .section-content li {
      margin-bottom: 8px;
    }

    /* Code Block */
    .code-block {
      background: var(--code-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0;
      margin: 20px 0;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .code-header {
      background: var(--bg-tertiary);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .code-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .run-button, .copy-button {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .run-button:hover, .copy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 255, 0.4);
    }

    .code-content {
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      color: var(--text-primary);
    }

    .code-content pre {
      margin: 0;
    }

    /* Output */
    .output-container {
      background: var(--bg-tertiary);
      border: 2px solid var(--success);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .output-header {
      color: var(--success);
      margin-bottom: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .output-content {
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    /* Quiz Section */
    .quiz-container {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(255, 0, 128, 0.05));
      border: 2px solid var(--accent-yellow);
      border-radius: 12px;
      padding: 30px;
      margin: 40px 0;
    }

    .quiz-header {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent-yellow);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quiz-question {
      font-size: 17px;
      margin-bottom: 20px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-option {
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 15px 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
    }

    .quiz-option:hover {
      background: var(--bg-secondary);
      border-color: var(--accent-cyan);
      transform: translateX(8px);
    }

    .quiz-option.selected {
      border-color: var(--accent-cyan);
      background: rgba(0, 217, 255, 0.1);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: rgba(0, 255, 136, 0.1);
    }

    .quiz-option.incorrect {
      border-color: var(--error);
      background: rgba(255, 23, 68, 0.1);
    }

    .quiz-feedback {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 15px;
      animation: slideUp 0.3s ease;
    }

    .quiz-feedback.correct {
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid var(--success);
      color: var(--success);
    }

    .quiz-feedback.incorrect {
      background: rgba(255, 23, 68, 0.1);
      border: 2px solid var(--error);
      color: var(--error);
    }

    .quiz-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .quiz-button {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .quiz-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 255, 0.4);
    }

    .quiz-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Navigation Buttons */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      padding-top: 40px;
      border-top: 2px solid var(--border);
    }

    .nav-button {
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      color: var(--text-primary);
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-button:hover:not(:disabled) {
      background: var(--bg-secondary);
      border-color: var(--accent-cyan);
      transform: scale(1.05);
    }

    .nav-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Info Box */
    .info-box {
      background: rgba(157, 78, 221, 0.1);
      border: 2px solid var(--accent-purple);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }

    .info-box-title {
      color: var(--accent-purple);
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }

    .warning-box {
      background: rgba(255, 107, 53, 0.1);
      border: 2px solid var(--accent-orange);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }

    .warning-box-title {
      color: var(--accent-orange);
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-cyan);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-pink);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -360px;
        transition: left 0.3s ease;
        z-index: 100;
        height: 100vh;
      }

      .sidebar.open {
        left: 0;
      }

      .content-wrapper {
        padding: 20px;
      }

      .topic-title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // COMPLETE Course Data with ALL 80+ topics from ALL PDFs
    const courseData = [
      // ============================================================
      // SECTION 1: ADVANCED JAVASCRIPT - OOP (20 topics)
      // ============================================================
      {
        id: 'object-literals',
        title: 'Object Literals',
        subtitle: 'JavaScript Objects Fundamentals',
        icon: '📦',
        section: 'Advanced JS - OOP',
        content: [
          {
            type: 'explanation',
            text: 'Object literals are the simplest way to create objects in JavaScript using curly braces {}. They can contain properties (data) and methods (functions).'
          },
          {
            type: 'code',
            title: 'Basic Object & Destructuring',
            code: `let circle = {
  radius: 1,
  border: 2
};

// Destructuring - extract into variables
const { radius, border } = circle;
console.log('Radius:', radius);
console.log('Border:', border);`,
            runnable: true
          },
          {
            type: 'code',
            title: 'Nested Objects',
            code: `let circle = {
  radius: 1,
  border: 2,
  location: {
    x: 45,
    y: 35
  }
};

console.log('Location X:', circle.location.x);
console.log('Location Y:', circle.location.y);`,
            runnable: true
          },
          {
            type: 'code',
            title: 'Methods in Objects',
            code: `let circle = {
  radius: 5,
  draw: function() {
    console.log('Drawing circle with radius:', this.radius);
  }
};

circle.draw();`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What is destructuring used for?',
          options: [
            'To delete properties from objects',
            'To extract values from objects into variables',
            'To merge objects',
            'To convert objects to arrays'
          ],
          correct: 1,
          explanation: 'Destructuring allows you to extract properties from objects and bind them to variables in a single statement.'
        }
      },

      {
        id: 'factory-functions',
        title: 'Factory Functions',
        subtitle: 'Creating Objects with Functions',
        icon: '🏭',
        section: 'Advanced JS - OOP',
        content: [
          {
            type: 'explanation',
            text: 'Factory functions are regular functions that return new objects. They provide a simple way to create multiple instances without using constructors.'
          },
          {
            type: 'code',
            title: 'Factory Function Pattern',
            code: `function createCircle(radius, border) {
  return {
    radius: radius,
    border: border,
    getArea: function() {
      return Math.PI * this.radius * this.radius;
    }
  };
}

// Create instances
let circle1 = createCircle(5, 2);
let circle2 = createCircle(10, 3);

console.log('Circle 1 area:', circle1.getArea().toFixed(2));
console.log('Circle 2 area:', circle2.getArea().toFixed(2));`,
            runnable: true
          },
          {
            type: 'code',
            title: 'ES6 Shorthand',
            code: `function createCircle(radius, border) {
  return {
    radius,  // shorthand for radius: radius
    border,
    getArea() {  // shorthand method
      return Math.PI * this.radius * this.radius;
    }
  };
}

let circle = createCircle(7, 1);
console.log('Area:', circle.getArea().toFixed(2));`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What do factory functions return?',
          options: [
            'A class definition',
            'A new object',
            'A constructor',
            'Nothing'
          ],
          correct: 1,
          explanation: 'Factory functions are regular functions that return new objects when called.'
        }
      },

      {
        id: 'constructor-functions',
        title: 'Constructor Functions',
        subtitle: 'Using the "new" Keyword',
        icon: '🏗️',
        section: 'Advanced JS - OOP',
        content: [
          {
            type: 'explanation',
            text: 'Constructor functions use the "new" keyword to create objects. Convention is to name them with a capital letter. They use "this" to set properties.'
          },
          {
            type: 'code',
            title: 'Constructor Pattern',
            code: `function Circle(radius) {
  this.radius = radius;
  this.draw = function() {
    console.log("Drawing circle: r=" + this.radius);
  };
}

// Create instances with "new"
const c1 = new Circle(5);
const c2 = new Circle(10);

c1.draw();
c2.draw();
console.log('c1 radius:', c1.radius);`,
            runnable: true
          },
          {
            type: 'info',
            title: 'What "new" Does',
            text: `When you use the "new" keyword:
1. Creates an empty object {}
2. Sets "this" to that new object
3. Links the object to the constructor's prototype
4. Returns "this" (the new object)

Without "new", "this" refers to the global object!`
          },
          {
            type: 'code',
            title: 'Constructor Property',
            code: `function Circle(radius) {
  this.radius = radius;
}

const c = new Circle(5);

// Every object has a constructor property
console.log('Constructor:', c.constructor.name);
console.log('Is Circle?', c.constructor === Circle);`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What happens if you forget "new" with a constructor?',
          options: [
            'Works the same way',
            '"this" refers to global object, properties are created globally',
            'Returns null',
            'Throws an error automatically'
          ],
          correct: 1,
          explanation: 'Without "new", "this" refers to the global object (window in browsers), so properties are created on the global object instead of a new instance.'
        }
      },

      {
        id: 'this-keyword',
        title: 'The "this" Keyword',
        subtitle: 'Understanding Context',
        icon: '👉',
        section: 'Advanced JS - OOP',
        content: [
          {
            type: 'explanation',
            text: '"this" refers to the object that is executing the current function. Its value depends on HOW the function is called, not where it\'s defined.'
          },
          {
            type: 'code',
            title: 'this in Methods',
            code: `const person = {
  name: 'Alice',
  age: 25,
  greet: function() {
    console.log('Hi, I am ' + this.name);
    console.log('Age:', this.age);
  }
};

person.greet(); // "this" refers to person object`,
            runnable: true
          },
          {
            type: 'code',
            title: 'this in Constructor',
            code: `function Person(name, age) {
  this.name = name;
  this.age = age;
  this.greet = function() {
    console.log('Hello from', this.name);
  };
}

const p1 = new Person('Bob', 30);
const p2 = new Person('Charlie', 35);

p1.greet(); // "this" refers to p1
p2.greet(); // "this" refers to p2`,
            runnable: true
          },
          {
            type: 'warning',

    // Main App Component (same as before)
    function App() {
      const [currentTopicIndex, setCurrentTopicIndex] = useState(0);
      const [completedTopics, setCompletedTopics] = useState({});
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showQuizFeedback, setShowQuizFeedback] = useState(false);
      const [codeOutputs, setCodeOutputs] = useState({});

      const currentTopic = courseData[currentTopicIndex];
      const progress = (Object.keys(completedTopics).length / courseData.length) * 100;

      // Group topics by section
      const sections = {};
      courseData.forEach((topic, index) => {
        if (!sections[topic.section]) {
          sections[topic.section] = [];
        }
        sections[topic.section].push({ ...topic, index });
      });

      useEffect(() => {
        const loadProgress = async () => {
          try {
            const result = await window.storage.get('completed-topics-complete');
            if (result) {
              setCompletedTopics(JSON.parse(result.value));
            }
          } catch (error) {
            console.log('No saved progress');
          }
        };
        loadProgress();
      }, []);

      const markTopicComplete = async () => {
        const newCompleted = { ...completedTopics, [currentTopic.id]: true };
        setCompletedTopics(newCompleted);
        
        try {
          await window.storage.set('completed-topics-complete', JSON.stringify(newCompleted));
        } catch (error) {
          console.log('Could not save progress');
        }
      };

      const runCode = (code, index) => {
        try {
          const logs = [];
          const originalLog = console.log;
          console.log = (...args) => {
            logs.push(args.map(arg => 
              typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' '));
          };

          eval(code);
          console.log = originalLog;

          setCodeOutputs(prev => ({
            ...prev,
            [index]: logs.join('\n')
          }));
        } catch (error) {
          setCodeOutputs(prev => ({
            ...prev,
            [index]: 'Error: ' + error.message
          }));
        }
      };

      const copyCode = (code) => {
        navigator.clipboard.writeText(code);
      };

      const checkAnswer = () => {
        if (selectedAnswer === currentTopic.quiz.correct) {
          markTopicComplete();
        }
        setShowQuizFeedback(true);
      };

      const nextTopic = () => {
        if (currentTopicIndex < courseData.length - 1) {
          setCurrentTopicIndex(currentTopicIndex + 1);
          setSelectedAnswer(null);
          setShowQuizFeedback(false);
          setCodeOutputs({});
          window.scrollTo(0, 0);
        }
      };

      const prevTopic = () => {
        if (currentTopicIndex > 0) {
          setCurrentTopicIndex(currentTopicIndex - 1);
          setSelectedAnswer(null);
          setShowQuizFeedback(false);
          setCodeOutputs({});
          window.scrollTo(0, 0);
        }
      };

      return (
        <div className="app-container">
          <div className="bg-animation">
            <div className="bg-grid"></div>
            <div className="bg-gradient bg-gradient-1"></div>
            <div className="bg-gradient bg-gradient-2"></div>
          </div>

          {/* Sidebar */}
          <div className="sidebar">
            <div className="sidebar-header">
              <div className="logo">Full Stack Mastery</div>
              <div className="subtitle">Complete JavaScript & Node.js Course</div>
              <div className="progress-container">
                <div className="progress-label">
                  <span>Progress</span>
                  <span>{Math.round(progress)}%</span>
                </div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: progress + '%' }}></div>
                </div>
              </div>
            </div>

            <div className="topics-list">
              {Object.entries(sections).map(([sectionName, topics]) => (
                <div key={sectionName}>
                  <div className="section-header">
                    {sectionName}
                    <span className="section-count">{topics.length}</span>
                  </div>
                  {topics.map((topic) => (
                    <div
                      key={topic.id}
                      className={`topic-item ${topic.index === currentTopicIndex ? 'active' : ''} ${completedTopics[topic.id] ? 'completed' : ''}`}
                      onClick={() => {
                        setCurrentTopicIndex(topic.index);
                        setSelectedAnswer(null);
                        setShowQuizFeedback(false);
                        setCodeOutputs({});
                      }}
                    >
                      <span className="topic-icon">{topic.icon}</span>
                      <span className="topic-name">{topic.title}</span>
                      {completedTopics[topic.id] && <span className="check-icon">✓</span>}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>

          {/* Main Content */}
          <div className="main-content">
            <div className="content-wrapper">
              <div className="topic-header">
                <div className="topic-title">{currentTopic.icon} {currentTopic.title}</div>
                <div className="topic-subtitle">{currentTopic.subtitle}</div>
              </div>

              {/* Content Sections */}
              {currentTopic.content.map((section, index) => (
                <div key={index} className="section">
                  {section.type === 'explanation' && (
                    <>
                      <div className="section-title">
                        <i data-lucide="book-open"></i>
                        Explanation
                      </div>
                      <div className="section-content">{section.text}</div>
                    </>
                  )}

                  {section.type === 'info' && (
                    <div className="info-box">
                      <div className="info-box-title">
                        <i data-lucide="info"></i>
                        {section.title}
                      </div>
                      <div className="section-content" style={{ whiteSpace: 'pre-line' }}>
                        {section.text}
                      </div>
                    </div>
                  )}

                  {section.type === 'warning' && (
                    <div className="warning-box">
                      <div className="warning-box-title">
                        <i data-lucide="alert-triangle"></i>
                        {section.title}
                      </div>
                      <div className="section-content" style={{ whiteSpace: 'pre-line' }}>
                        {section.text}
                      </div>
                    </div>
                  )}

                  {section.type === 'code' && (
                    <>
                      <div className="section-title">
                        <i data-lucide="code-2"></i>
                        {section.title}
                      </div>
                      <div className="code-block">
                        <div className="code-header">
                          <div className="code-title">
                            <i data-lucide="terminal"></i>
                            {section.runnable ? 'JavaScript' : 'Code Example'}
                          </div>
                          <div style={{ display: 'flex', gap: '8px' }}>
                            {section.runnable && (
                              <button className="run-button" onClick={() => runCode(section.code, index)}>
                                <i data-lucide="play"></i>
                                Run
                              </button>
                            )}
                            <button className="copy-button" onClick={() => copyCode(section.code)}>
                              <i data-lucide="copy"></i>
                              Copy
                            </button>
                          </div>
                        </div>
                        <div className="code-content">
                          <pre>{section.code}</pre>
                        </div>
                      </div>
                      {codeOutputs[index] && (
                        <div className="output-container">
                          <div className="output-header">
                            <i data-lucide="terminal-square"></i>
                            Output
                          </div>
                          <div className="output-content">{codeOutputs[index]}</div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              ))}

              {/* Quiz */}
              {currentTopic.quiz && (
                <div className="quiz-container">
                  <div className="quiz-header">
                    <i data-lucide="help-circle"></i>
                    Test Your Knowledge
                  </div>
                  <div className="quiz-question">{currentTopic.quiz.question}</div>
                  <div className="quiz-options">
                    {currentTopic.quiz.options.map((option, index) => (
                      <div
                        key={index}
                        className={`quiz-option ${selectedAnswer === index ? 'selected' : ''} ${
                          showQuizFeedback && index === currentTopic.quiz.correct ? 'correct' : ''
                        } ${
                          showQuizFeedback && selectedAnswer === index && index !== currentTopic.quiz.correct ? 'incorrect' : ''
                        }`}
                        onClick={() => !showQuizFeedback && setSelectedAnswer(index)}
                      >
                        {option}
                      </div>
                    ))}
                  </div>
                  {!showQuizFeedback && (
                    <div className="quiz-buttons">
                      <button
                        className="quiz-button"
                        onClick={checkAnswer}
                        disabled={selectedAnswer === null}
                      >
                        Check Answer
                      </button>
                    </div>
                  )}
                  {showQuizFeedback && (
                    <div className={`quiz-feedback ${selectedAnswer === currentTopic.quiz.correct ? 'correct' : 'incorrect'}`}>
                      <strong>
                        {selectedAnswer === currentTopic.quiz.correct ? '✓ Correct!' : '✗ Incorrect'}
                      </strong>
                      <br />
                      {currentTopic.quiz.explanation}
                    </div>
                  )}
                </div>
              )}

              {/* Navigation */}
              <div className="nav-buttons">
                <button className="nav-button" onClick={prevTopic} disabled={currentTopicIndex === 0}>
                  <i data-lucide="chevron-left"></i>
                  Previous
                </button>
                <button className="nav-button" onClick={nextTopic} disabled={currentTopicIndex === courseData.length - 1}>
                  Next
                  <i data-lucide="chevron-right"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render
    ReactDOM.render(<App />, document.getElementById('root'));

    // Initialize Lucide icons
    setTimeout(() => lucide.createIcons(), 100);
  </script>
</body>
</html>
