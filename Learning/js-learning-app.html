<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced JS Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide-static@0.263.1/font/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #131729;
      --bg-tertiary: #1a1f3a;
      --accent-cyan: #00d9ff;
      --accent-pink: #ff0080;
      --accent-yellow: #ffeb3b;
      --accent-green: #00ff88;
      --text-primary: #e8eaf6;
      --text-secondary: #9fa8da;
      --text-muted: #5c6bc0;
      --border: #283593;
      --code-bg: #0d1117;
      --success: #00ff88;
      --warning: #ffeb3b;
      --error: #ff1744;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .app-container {
      display: flex;
      height: 100vh;
      position: relative;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }

    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .bg-gradient {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      animation: float 15s ease-in-out infinite;
    }

    .bg-gradient-1 {
      background: var(--accent-cyan);
      top: 10%;
      left: 20%;
    }

    .bg-gradient-2 {
      background: var(--accent-pink);
      bottom: 20%;
      right: 10%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 30px) scale(0.9); }
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--bg-secondary);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
    }

    .sidebar-header {
      padding: 30px 20px;
      border-bottom: 2px solid var(--border);
      background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .progress-container {
      margin-top: 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg-tertiary);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      transition: width 0.5s ease;
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    /* Topic List */
    .topics-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .topic-item {
      padding: 14px 16px;
      margin: 6px 0;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      position: relative;
      overflow: hidden;
    }

    .topic-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: var(--accent-cyan);
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .topic-item:hover {
      background: var(--bg-primary);
      border-color: var(--accent-cyan);
      transform: translateX(4px);
    }

    .topic-item:hover::before {
      transform: scaleY(1);
    }

    .topic-item.active {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(255, 0, 128, 0.1));
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
    }

    .topic-item.active::before {
      transform: scaleY(1);
    }

    .topic-item.completed {
      border-color: var(--success);
    }

    .topic-icon {
      font-size: 18px;
      color: var(--accent-cyan);
    }

    .topic-item.completed .topic-icon {
      color: var(--success);
    }

    .topic-name {
      flex: 1;
      font-weight: 500;
    }

    .check-icon {
      color: var(--success);
      font-size: 16px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      overflow-y: auto;
      position: relative;
      z-index: 1;
    }

    .content-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px;
    }

    .topic-header {
      margin-bottom: 40px;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topic-title {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
    }

    .topic-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* Content Sections */
    .section {
      margin-bottom: 50px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title i {
      font-size: 24px;
    }

    .section-content {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    /* Code Block */
    .code-block {
      background: var(--code-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0;
      margin: 20px 0;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .code-header {
      background: var(--bg-tertiary);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .code-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .run-button, .copy-button {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .run-button:hover, .copy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 255, 0.4);
    }

    .code-content {
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-x: auto;
      color: var(--text-primary);
    }

    .code-content pre {
      margin: 0;
    }

    /* Output */
    .output-container {
      background: var(--bg-tertiary);
      border: 2px solid var(--success);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .output-header {
      color: var(--success);
      margin-bottom: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .output-content {
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    /* Interactive Playground */
    .playground {
      background: var(--bg-tertiary);
      border: 2px solid var(--accent-pink);
      border-radius: 12px;
      padding: 20px;
      margin: 30px 0;
    }

    .playground-header {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent-pink);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playground-editor {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text-primary);
      min-height: 150px;
      width: 100%;
      resize: vertical;
      outline: none;
    }

    /* Quiz Section */
    .quiz-container {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(255, 0, 128, 0.05));
      border: 2px solid var(--accent-yellow);
      border-radius: 12px;
      padding: 30px;
      margin: 40px 0;
    }

    .quiz-header {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent-yellow);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quiz-question {
      font-size: 18px;
      margin-bottom: 20px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-option {
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 16px;
    }

    .quiz-option:hover {
      background: var(--bg-secondary);
      border-color: var(--accent-cyan);
      transform: translateX(8px);
    }

    .quiz-option.selected {
      border-color: var(--accent-cyan);
      background: rgba(0, 217, 255, 0.1);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: rgba(0, 255, 136, 0.1);
    }

    .quiz-option.incorrect {
      border-color: var(--error);
      background: rgba(255, 23, 68, 0.1);
    }

    .quiz-feedback {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 16px;
      animation: slideUp 0.3s ease;
    }

    .quiz-feedback.correct {
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid var(--success);
      color: var(--success);
    }

    .quiz-feedback.incorrect {
      background: rgba(255, 23, 68, 0.1);
      border: 2px solid var(--error);
      color: var(--error);
    }

    .quiz-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .quiz-button {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .quiz-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 255, 0.4);
    }

    .quiz-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Navigation Buttons */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      padding-top: 40px;
      border-top: 2px solid var(--border);
    }

    .nav-button {
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      color: var(--text-primary);
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-button:hover {
      background: var(--bg-secondary);
      border-color: var(--accent-cyan);
      transform: scale(1.05);
    }

    .nav-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-cyan);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-pink);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -320px;
        transition: left 0.3s ease;
        z-index: 100;
      }

      .sidebar.open {
        left: 0;
      }

      .content-wrapper {
        padding: 20px;
      }

      .topic-title {
        font-size: 32px;
      }
    }

    /* Syntax Highlighting */
    .keyword { color: #ff79c6; }
    .string { color: #50fa7b; }
    .function { color: #8be9fd; }
    .comment { color: #6272a4; }
    .number { color: #bd93f9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Course Data
    const courseData = [
      {
        id: 'object-literals',
        title: 'Object Literals',
        subtitle: 'Understanding JavaScript Objects',
        icon: '📦',
        content: [
          {
            type: 'explanation',
            text: 'Object literals are the simplest way to create objects in JavaScript. They use curly braces {} to define properties and methods.'
          },
          {
            type: 'code',
            title: 'Basic Object',
            code: `let circle = {
  radius: 1,
  border: 2
};

// Destructuring
const { radius, border } = circle;
console.log(radius); // 1
console.log(border); // 2`,
            runnable: true
          },
          {
            type: 'code',
            title: 'Nested Objects',
            code: `let circle = {
  radius: 1,
  border: 2,
  location: {
    x: 45,
    y: 35
  }
};

console.log(circle.location.x); // 45`,
            runnable: true
          },
          {
            type: 'code',
            title: 'Methods in Objects',
            code: `let circle = {
  radius: 1,
  draw: function() {
    console.log('Drawing circle with radius: ' + this.radius);
  }
};

circle.draw();`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What is destructuring used for?',
          options: [
            'To delete properties from objects',
            'To extract values from objects into variables',
            'To merge two objects together',
            'To convert objects to arrays'
          ],
          correct: 1,
          explanation: 'Destructuring allows you to extract properties from objects and bind them to variables in a single statement.'
        }
      },
      {
        id: 'factory-functions',
        title: 'Factory Functions',
        subtitle: 'Creating Objects with Functions',
        icon: '🏭',
        content: [
          {
            type: 'explanation',
            text: 'Factory functions are regular functions that return new objects. They provide a way to create multiple instances of similar objects without using constructors.'
          },
          {
            type: 'code',
            title: 'Factory Function Example',
            code: `function createCircle(radius, border) {
  return {
    radius: radius,
    border: border,
    getArea: function() {
      return Math.PI * this.radius * this.radius;
    }
  };
}

// Usage
let myCircle = createCircle(5, 2);
console.log('Radius:', myCircle.radius);
console.log('Border:', myCircle.border);
console.log('Area:', myCircle.getArea().toFixed(2));`,
            runnable: true
          },
          {
            type: 'code',
            title: 'ES6 Shorthand',
            code: `function createCircle(radius, border) {
  return {
    radius,  // shorthand for radius: radius
    border,
    getArea() {  // shorthand method syntax
      return Math.PI * this.radius * this.radius;
    }
  };
}

let circle = createCircle(3, 1);
console.log(circle.getArea().toFixed(2));`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What do factory functions return?',
          options: [
            'A class definition',
            'A new object',
            'A constructor',
            'A prototype'
          ],
          correct: 1,
          explanation: 'Factory functions are regular functions that return new objects when called.'
        }
      },
      {
        id: 'constructor-functions',
        title: 'Constructor Functions',
        subtitle: 'Object Creation with new keyword',
        icon: '🏗️',
        content: [
          {
            type: 'explanation',
            text: 'Constructor functions use the "new" keyword to create objects. They use "this" to set properties and are conventionally named with a capital letter.'
          },
          {
            type: 'code',
            title: 'Constructor Function',
            code: `function Circle(radius) {
  this.radius = radius;
  this.draw = function() {
    console.log("Drawing circle: r=" + this.radius);
  };
}

const c = new Circle(5);
c.draw();
console.log('Radius:', c.radius);`,
            runnable: true
          },
          {
            type: 'code',
            title: 'What "new" does',
            code: `// When you use "new":
// 1. Creates empty object {}
// 2. Sets "this" to that object
// 3. Returns "this" (the new object)

function Person(name) {
  this.name = name;
  this.greet = function() {
    console.log('Hello, I am ' + this.name);
  };
}

const person1 = new Person('Alice');
const person2 = new Person('Bob');
person1.greet();
person2.greet();`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What does the "new" keyword do?',
          options: [
            'Creates a new variable',
            'Creates a new object and sets "this" to it',
            'Creates a new function',
            'Creates a new array'
          ],
          correct: 1,
          explanation: 'The "new" keyword creates a new empty object, sets "this" to that object, and returns it from the constructor.'
        }
      },
      {
        id: 'this-keyword',
        title: 'The "this" Keyword',
        subtitle: 'Context and Binding',
        icon: '👉',
        content: [
          {
            type: 'explanation',
            text: '"this" refers to the object that is executing the current function. Its value depends on how the function is called.'
          },
          {
            type: 'code',
            title: 'this in Methods',
            code: `const person = {
  name: 'Alice',
  greet: function() {
    console.log('Hello, I am ' + this.name);
  }
};

person.greet(); // "this" refers to person`,
            runnable: true
          },
          {
            type: 'code',
            title: 'this in Regular Functions',
            code: `function showThis() {
  console.log(this); // undefined in strict mode
}

showThis();

// In constructor
function Person(name) {
  this.name = name;
  console.log('this refers to new object:', this);
}

new Person('Bob');`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What does "this" refer to in a method?',
          options: [
            'The global object',
            'The function itself',
            'The object calling the method',
            'undefined'
          ],
          correct: 2,
          explanation: 'In a method, "this" refers to the object that is calling the method.'
        }
      },
      {
        id: 'value-reference',
        title: 'Value vs Reference Types',
        subtitle: 'Primitives and Objects',
        icon: '🔄',
        content: [
          {
            type: 'explanation',
            text: 'Primitives (numbers, strings, booleans) are copied by value. Objects (objects, arrays, functions) are copied by reference.'
          },
          {
            type: 'code',
            title: 'Primitives (Value Types)',
            code: `let x = 10;
let y = x;  // Copy the VALUE
x = 20;

console.log('x:', x);  // 20
console.log('y:', y);  // 10 (unchanged)`,
            runnable: true
          },
          {
            type: 'code',
            title: 'Objects (Reference Types)',
            code: `let x = { value: 10 };
let y = x;  // Copy the REFERENCE (memory address)
x.value = 20;

console.log('x.value:', x.value);  // 20
console.log('y.value:', y.value);  // 20 (changed!)`,
            runnable: true
          },
          {
            type: 'code',
            title: 'Functions with Primitives vs Objects',
            code: `// Primitive
let num = 10;
function increase(n) {
  n++;
}
increase(num);
console.log('num:', num);  // 10 (unchanged)

// Object
let obj = { value: 10 };
function increaseObj(o) {
  o.value++;
}
increaseObj(obj);
console.log('obj.value:', obj.value);  // 11 (changed!)`,
            runnable: true
          }
        ],
        quiz: {
          question: 'What happens when you assign one object to another?',
          options: [

          options: [

          ],
          correct: 1,
          explanation: 'CommonJS uses require/module.exports (Node.js), while ES6 uses import/export (modern JavaScript standard).'
        }
      }
    ];

    // Main App Component
    function App() {
      const [currentTopicIndex, setCurrentTopicIndex] = useState(0);
      const [completedTopics, setCompletedTopics] = useState({});
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showQuizFeedback, setShowQuizFeedback] = useState(false);
      const [codeOutputs, setCodeOutputs] = useState({});

      const currentTopic = courseData[currentTopicIndex];
      const progress = (Object.keys(completedTopics).length / courseData.length) * 100;

      useEffect(() => {
        // Load progress from storage
        const loadProgress = async () => {
          try {
            const result = await window.storage.get('completed-topics');
            if (result) {
              setCompletedTopics(JSON.parse(result.value));
            }
          } catch (error) {
            console.log('No saved progress');
          }
        };
        loadProgress();
      }, []);

      const markTopicComplete = async () => {
        const newCompleted = { ...completedTopics, [currentTopic.id]: true };
        setCompletedTopics(newCompleted);
        
        try {
          await window.storage.set('completed-topics', JSON.stringify(newCompleted));
        } catch (error) {
          console.log('Could not save progress');
        }
      };

      const runCode = (code, index) => {
        try {
          // Capture console.log
          const logs = [];
          const originalLog = console.log;
          console.log = (...args) => {
            logs.push(args.map(arg => 
              typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' '));
          };

          // Run code
          eval(code);

          // Restore console.log
          console.log = originalLog;

          // Store output
          setCodeOutputs(prev => ({
            ...prev,
            [index]: logs.join('\n')
          }));
        } catch (error) {
          setCodeOutputs(prev => ({
            ...prev,
            [index]: 'Error: ' + error.message
          }));
        }
      };

      const copyCode = (code) => {
        navigator.clipboard.writeText(code);
      };

      const checkAnswer = () => {
        if (selectedAnswer === currentTopic.quiz.correct) {
          markTopicComplete();
        }
        setShowQuizFeedback(true);
      };

      const nextTopic = () => {
        if (currentTopicIndex < courseData.length - 1) {
          setCurrentTopicIndex(currentTopicIndex + 1);
          setSelectedAnswer(null);
          setShowQuizFeedback(false);
          setCodeOutputs({});
          window.scrollTo(0, 0);
        }
      };

      const prevTopic = () => {
        if (currentTopicIndex > 0) {
          setCurrentTopicIndex(currentTopicIndex - 1);
          setSelectedAnswer(null);
          setShowQuizFeedback(false);
          setCodeOutputs({});
          window.scrollTo(0, 0);
        }
      };

      return (
        <div className="app-container">
          <div className="bg-animation">
            <div className="bg-grid"></div>
            <div className="bg-gradient bg-gradient-1"></div>
            <div className="bg-gradient bg-gradient-2"></div>
          </div>

          {/* Sidebar */}
          <div className="sidebar">
            <div className="sidebar-header">
              <div className="logo">Advanced JS</div>
              <div className="progress-container">
                <div className="progress-label">
                  <span>Progress</span>
                  <span>{Math.round(progress)}%</span>
                </div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: progress + '%' }}></div>
                </div>
              </div>
            </div>

            <div className="topics-list">
              {courseData.map((topic, index) => (
                <div
                  key={topic.id}
                  className={`topic-item ${index === currentTopicIndex ? 'active' : ''} ${completedTopics[topic.id] ? 'completed' : ''}`}
                  onClick={() => {
                    setCurrentTopicIndex(index);
                    setSelectedAnswer(null);
                    setShowQuizFeedback(false);
                    setCodeOutputs({});
                  }}
                >
                  <span className="topic-icon">{topic.icon}</span>
                  <span className="topic-name">{topic.title}</span>
                  {completedTopics[topic.id] && <span className="check-icon">✓</span>}
                </div>
              ))}
            </div>
          </div>

          {/* Main Content */}
          <div className="main-content">
            <div className="content-wrapper">
              <div className="topic-header">
                <div className="topic-title">{currentTopic.icon} {currentTopic.title}</div>
                <div className="topic-subtitle">{currentTopic.subtitle}</div>
              </div>

              {/* Content Sections */}
              {currentTopic.content.map((section, index) => (
                <div key={index} className="section">
                  {section.type === 'explanation' && (
                    <>
                      <div className="section-title">
                        <i data-lucide="book-open"></i>
                        Explanation
                      </div>
                      <div className="section-content">{section.text}</div>
                    </>
                  )}

                  {section.type === 'code' && (
                    <>
                      <div className="section-title">
                        <i data-lucide="code-2"></i>
                        {section.title}
                      </div>
                      <div className="code-block">
                        <div className="code-header">
                          <div className="code-title">
                            <i data-lucide="terminal"></i>
                            JavaScript
                          </div>
                          <div style={{ display: 'flex', gap: '8px' }}>
                            {section.runnable && (
                              <button className="run-button" onClick={() => runCode(section.code, index)}>
                                <i data-lucide="play"></i>
                                Run
                              </button>
                            )}
                            <button className="copy-button" onClick={() => copyCode(section.code)}>
                              <i data-lucide="copy"></i>
                              Copy
                            </button>
                          </div>
                        </div>
                        <div className="code-content">
                          <pre>{section.code}</pre>
                        </div>
                      </div>
                      {codeOutputs[index] && (
                        <div className="output-container">
                          <div className="output-header">
                            <i data-lucide="terminal-square"></i>
                            Output
                          </div>
                          <div className="output-content">{codeOutputs[index]}</div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              ))}

              {/* Quiz */}
              <div className="quiz-container">
                <div className="quiz-header">
                  <i data-lucide="help-circle"></i>
                  Test Your Knowledge
                </div>
                <div className="quiz-question">{currentTopic.quiz.question}</div>
                <div className="quiz-options">
                  {currentTopic.quiz.options.map((option, index) => (
                    <div
                      key={index}
                      className={`quiz-option ${selectedAnswer === index ? 'selected' : ''} ${
                        showQuizFeedback && index === currentTopic.quiz.correct ? 'correct' : ''
                      } ${
                        showQuizFeedback && selectedAnswer === index && index !== currentTopic.quiz.correct ? 'incorrect' : ''
                      }`}
                      onClick={() => !showQuizFeedback && setSelectedAnswer(index)}
                    >
                      {option}
                    </div>
                  ))}
                </div>
                {!showQuizFeedback && (
                  <div className="quiz-buttons">
                    <button
                      className="quiz-button"
                      onClick={checkAnswer}
                      disabled={selectedAnswer === null}
                    >
                      Check Answer
                    </button>
                  </div>
                )}
                {showQuizFeedback && (
                  <div className={`quiz-feedback ${selectedAnswer === currentTopic.quiz.correct ? 'correct' : 'incorrect'}`}>
                    <strong>
                      {selectedAnswer === currentTopic.quiz.correct ? '✓ Correct!' : '✗ Incorrect'}
                    </strong>
                    <br />
                    {currentTopic.quiz.explanation}
                  </div>
                )}
              </div>

              {/* Navigation */}
              <div className="nav-buttons">
                <button className="nav-button" onClick={prevTopic} disabled={currentTopicIndex === 0}>
                  <i data-lucide="chevron-left"></i>
                  Previous
                </button>
                <button className="nav-button" onClick={nextTopic} disabled={currentTopicIndex === courseData.length - 1}>
                  Next
                  <i data-lucide="chevron-right"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render
    ReactDOM.render(<App />, document.getElementById('root'));

    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
